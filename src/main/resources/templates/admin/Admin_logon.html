<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WineStore – Admin Login</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --primary: #0ea5e9;
        --primary-dark: #0284c7;
        --primary-light: #e0f2fe;
        --accent: #06b6d4;
        --bg: #f0f9ff;
        --surface: #ffffff;
        --text: #0c1a2e;
        --text-body: #475569;
        --text-muted: #94a3b8;
        --border: #e2e8f0;
        --danger: #dc2626;
      }
      body {
        font-family: "Segoe UI Variable Text", "Segoe UI", "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        background: var(--bg);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        position: relative;
        overflow: hidden;
      }
      body::before, body::after {
        content: "";
        position: fixed;
        border-radius: 50%;
        pointer-events: none;
      }
      body::before {
        width: 600px; height: 600px;
        background: radial-gradient(circle, rgba(14, 165, 233, 0.15) 0%, transparent 70%);
        top: -200px; right: -150px;
      }
      body::after {
        width: 400px; height: 400px;
        background: radial-gradient(circle, rgba(6, 182, 212, 0.12) 0%, transparent 70%);
        bottom: -120px; left: -100px;
      }
      .login-card {
        width: 100%; max-width: 420px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 44px 44px 36px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.08), 0 2px 10px rgba(14,165,233,0.08);
        position: relative; z-index: 1;
        animation: popIn 0.5s cubic-bezier(0.22,0.68,0,1.2) both;
      }
      @keyframes popIn {
        from { transform: translateY(24px) scale(0.97); opacity: 0; }
        to { transform: translateY(0) scale(1); opacity: 1; }
      }
      .logo-wrap {
        display: flex; align-items: center; justify-content: center;
        gap: 10px; margin-bottom: 32px;
      }
      .logo-icon {
        width: 42px; height: 42px;
        background: linear-gradient(135deg, #0ea5e9, #06b6d4);
        border-radius: 11px;
        display: flex; align-items: center; justify-content: center;
        color: white;
        box-shadow: 0 4px 14px rgba(14,165,233,0.35);
      }
      .logo-icon svg { width: 22px; height: 22px; }
      .logo-text { line-height: 1.2; }
      .logo-name { font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
      .logo-sub { font-size: 10px; font-weight: 600; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
      .divider { height: 1px; background: var(--border); margin-bottom: 28px; }
      .login-heading { margin-bottom: 24px; text-align: center; }
      .login-heading h1 { font-size: 22px; font-weight: 700; color: var(--primary); letter-spacing: -0.4px; margin-bottom: 5px; }
      .login-heading p { font-size: 13.5px; color: var(--text-body); line-height: 1.5; }
      .form-group { margin-bottom: 18px; }
      label { display: block; font-size: 13px; font-weight: 600; color: var(--text-body); margin-bottom: 7px; }
      .input-wrap { position: relative; }
      .input-wrap svg.field-icon {
        position: absolute; left: 13px; top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted); pointer-events: none;
        width: 16px; height: 16px;
      }
      input[type="text"], input[type="password"] {
        width: 100%; padding: 11px 13px 11px 40px;
        border: 1.5px solid var(--border); border-radius: 10px;
        font-family: inherit; font-size: 14px;
        color: var(--text); background: #f8fafc;
        caret-color: var(--primary); outline: none;
        transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      }
      input:focus {
        border-color: var(--primary); background: white;
        box-shadow: 0 0 0 3px rgba(14,165,233,0.15);
      }
      input::placeholder { color: var(--text-muted); }
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus,
      input:-webkit-autofill:active {
        -webkit-text-fill-color: var(--text);
        box-shadow: 0 0 0 1000px #f8fafc inset;
      }
      .eye-toggle {
        position: absolute; right: 12px; top: 50%;
        transform: translateY(-50%);
        background: none; border: none; cursor: pointer;
        color: var(--text-muted); padding: 2px; display: flex;
        align-items: center; transition: color 0.2s;
      }
      .eye-toggle:hover { color: var(--primary); }

      .btn-login {
        width: 100%; padding: 12px;
        background: linear-gradient(135deg, #0ea5e9, #06b6d4);
        border: none; border-radius: 10px;
        color: white; font-family: inherit;
        font-size: 15px; font-weight: 600; cursor: pointer;
        letter-spacing: 0.1px;
        box-shadow: 0 6px 18px rgba(14,165,233,0.4);
        transition: transform 0.15s, box-shadow 0.15s;
        position: relative; overflow: hidden;
      }
      .btn-login:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(14,165,233,0.5); }
      .btn-login:active { transform: translateY(0); }
      .btn-login .ripple {
        position: absolute; border-radius: 50%;
        background: rgba(255,255,255,0.3);
        transform: scale(0);
        animation: ripple 0.5s linear;
        pointer-events: none;
      }
      @keyframes ripple { to { transform: scale(4); opacity: 0; } }
      .error-msg {
        display: none;
        background: #fef2f2; border: 1px solid #fecaca;
        border-radius: 8px; padding: 9px 13px; margin-bottom: 16px;
        font-size: 13px; color: var(--danger);
        align-items: center; gap: 8px;
      }
      .error-msg.show { display: flex; }
      .card-footer {
        text-align: center; margin-top: 24px; padding-top: 20px;
        border-top: 1px solid var(--border);
        font-size: 12px; color: var(--text-muted);
      }
      .loading-overlay {
        position: fixed; inset: 0;
        background: rgba(12,26,46,0.45);
        backdrop-filter: blur(4px);
        display: none; align-items: center; justify-content: center; z-index: 100;
      }
      .loading-overlay.show { display: flex; }
      .spinner {
        width: 38px; height: 38px;
        border: 3px solid #e0f2fe;
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="logo-wrap">
        <div class="logo-icon">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M8 2h8l-1 8a3 3 0 0 1-6 0L8 2z" />
            <path d="M7 10h10" />
            <path d="M12 14v8" />
            <path d="M9 22h6" />
          </svg>
        </div>
        <div class="logo-text">
          <div class="logo-name">WineStore</div>
          <div class="logo-sub">Admin Panel</div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="login-heading">
        <h1>Đăng nhập quản trị</h1>
        <p>Nhập thông tin tài khoản để truy cập hệ thống</p>
      </div>

      <div class="error-msg" id="errorMsg">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="15"
          height="15"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        <span id="errorText">Tên đăng nhập hoặc mật khẩu không đúng.</span>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Tên đăng nhập</label>
          <div class="input-wrap">
            <svg
              class="field-icon"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              />
            </svg>
            <input
              type="text"
              id="username"
              placeholder="Nhập tên đăng nhập"
              autocomplete="username"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <div class="input-wrap">
            <svg
              class="field-icon"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
              />
            </svg>
            <input
              type="password"
              id="password"
              placeholder="Nhập mật khẩu"
              autocomplete="current-password"
            />
            <button type="button" class="eye-toggle" id="eyeToggle">
              <svg
                id="eyeIcon"
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                />
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="loginBtn" style="margin-top:24px">Đăng nhập</button>
      </form>

      <div class="card-footer">
        © 2026 WineStore Admin Panel · Phiên bản 1.0.0
      </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
    </div>

    <script th:inline="javascript">
      const eyeToggle = document.getElementById("eyeToggle");
      const pwInput = document.getElementById("password");
      const eyeIcon = document.getElementById("eyeIcon");
      const loginApiUrl =
        /*[[@{/api/auth/admin/login}]]*/ "/api/auth/admin/login";
      const adminIndexUrl = /*[[@{/admin/index}]]*/ "/admin/index";
      const eyeOpen = `<path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>`;
      const eyeClose = `<path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>`;

      eyeToggle.addEventListener("click", () => {
        const show = pwInput.type === "password";
        pwInput.type = show ? "text" : "password";
        eyeIcon.innerHTML = show ? eyeClose : eyeOpen;
      });

      document
        .getElementById("loginBtn")
        .addEventListener("click", function (e) {
          const btn = this;
          const circle = document.createElement("span");
          const d = Math.max(btn.clientWidth, btn.clientHeight);
          const r = btn.getBoundingClientRect();
          circle.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
          circle.classList.add("ripple");
          btn.querySelector(".ripple")?.remove();
          btn.appendChild(circle);
        });

      document
        .getElementById("loginForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const user = document.getElementById("username").value.trim();
          const pass = document.getElementById("password").value;
          const loadingOverlay = document.getElementById("loadingOverlay");
          const loginBtn = document.getElementById("loginBtn");
          const err = document.getElementById("errorMsg");
          err.classList.remove("show");

          if (!user || !pass) {
            document.getElementById("errorText").textContent =
              "Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu.";
            err.classList.add("show");
            return;
          }

          loadingOverlay.classList.add("show");
          loginBtn.disabled = true;

          try {
            const res = await fetch(loginApiUrl, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              credentials: "same-origin",
              body: JSON.stringify({
                username: user,
                password: pass,
              }),
            });

            if (!res.ok) {
              const errorBody = await res.json().catch(() => ({}));
              document.getElementById("errorText").textContent =
                errorBody.message || "Tên đăng nhập hoặc mật khẩu không đúng.";
              err.classList.add("show");
              return;
            }

            // Đọc token từ response body và lưu vào localStorage
            const data = await res.json().catch(() => ({}));
            if (data.token) {
              localStorage.setItem("authToken", data.token);
            }
            loginBtn.textContent = "✓ Đăng nhập thành công!";
            loginBtn.style.background =
              "linear-gradient(135deg,#16a34a,#22c55e)";
            loginBtn.style.boxShadow = "0 6px 18px rgba(22,163,74,0.4)";
            setTimeout(() => {
              window.location.href = adminIndexUrl;
            }, 600);
          } catch (error) {
            document.getElementById("errorText").textContent =
              "Không thể kết nối tới máy chủ. Vui lòng thử lại.";
            err.classList.add("show");
          } finally {
            loadingOverlay.classList.remove("show");
            loginBtn.disabled = false;
          }
        });
    </script>
  </body>
</html>
