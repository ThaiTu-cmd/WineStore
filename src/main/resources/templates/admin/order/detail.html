<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Chi tiết đơn hàng - WineStore Admin</title>
    <link rel="stylesheet" th:href="@{/admin/css/style.css?v=1}" />
  </head>
  <body>
    <div class="admin-layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
          <div class="logo-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2h8l-1 8a3 3 0 0 1-6 0L8 2z" /><path d="M7 10h10" /><path d="M12 14v8" /><path d="M9 22h6" /></svg>
          </div>
          <div>
            <div class="logo-text">WineStore</div>
            <div class="logo-sub">Admin Panel</div>
          </div>
        </div>
        <nav class="sidebar-nav">
          <div class="nav-section-label">Tổng quan</div>
          <a class="nav-item" data-page="dashboard" th:href="@{/admin}"><span class="nav-icon">🏠</span> Dashboard</a>
          <div class="nav-section-label">Quản lý đơn hàng</div>
          <a class="nav-item active" data-page="orders" th:href="@{/admin/order/list}"><span class="nav-icon">📦</span> Orders<span class="nav-badge" id="navBadgeOrders">0</span></a>
          <div class="nav-section-label">Sản phẩm</div>
          <a class="nav-item" data-page="products" th:href="@{/admin/product/list}"><span class="nav-icon">🛍</span> Products</a>
          <a class="nav-item" data-page="categories" th:href="@{/admin/product/category}"><span class="nav-icon">🗂</span> Categories</a>
          <div class="nav-section-label">Người dùng</div>
          <a class="nav-item" data-page="users" th:href="@{/admin/user/list}"><span class="nav-icon">👥</span> Users</a>
          <div class="nav-section-label">Marketing</div>
          <a class="nav-item" data-page="discounts" th:href="@{/admin/marketing/discount}"><span class="nav-icon">🎁</span> Discounts</a>
          <a class="nav-item" data-page="reviews" th:href="@{/admin/reviews/review}"><span class="nav-icon">⭐</span> Reviews</a>
        </nav>
        <div class="sidebar-bottom">
          <div class="admin-profile">
            <div class="admin-avatar">A</div>
            <div>
              <div class="admin-name">Admin Master</div>
              <div class="admin-role">Super Admin</div>
            </div>
          </div>
        </div>
      </aside>

      <div class="main-wrap">
        <header class="topbar">
          <div class="topbar-info">
            <div class="topbar-title" id="topbarTitle">Chi tiết đơn hàng</div>
            <div class="topbar-breadcrumb">Đơn hàng - Chi tiết</div>
          </div>
          <div class="topbar-right">
            <button class="icon-btn" title="Cài đặt" onclick="toggleLogoutDropdown()">⚙️</button>
            <div class="dropdown-menu" id="logoutDropdown" style="display: none">
              <button class="dropdown-item dropdown-item-logout" onclick="logout()">Đăng xuất</button>
            </div>
          </div>
        </header>
        <div class="page-wrap">
          <div class="page-header">
            <div>
              <div class="page-title" id="detailTitle">Chi tiết đơn hàng</div>
              <div class="page-subtitle" id="detailCreated"></div>
            </div>
            <div id="detailStatusBadge"></div>
          </div>

          <div class="card">
            <div class="card-header"><strong>Thông tin đơn hàng</strong></div>
            <div class="card-body">
              <div class="detail-grid" id="detailGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:22px"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script th:src="@{/admin/js/admin.js}"></script>
    <script>
      async function loadDetail() {
        const params = new URLSearchParams(location.search);
        const id = parseInt(params.get("id"));
        if (!id) return;

        const d = await API.getOrderById(id);
        if (!d) return;

        document.getElementById("topbarTitle").textContent = d.order_code;
        document.getElementById("detailTitle").textContent = "Đơn hàng: " + d.order_code;
        document.getElementById("detailCreated").textContent = "Ngày tạo: " + d.created_at;
        document.getElementById("detailStatusBadge").innerHTML = Utils.statusBadge(d.status);

        const fields = [
          ["Mã đơn hàng", d.order_code],
          ["Khách hàng", d.username || "N/A"],
          ["Tổng tiền", Utils.formatCurrency(d.total || 0)],
          ["Trạng thái", d.status],
          ["Mã giảm giá", d.discount_code_id ? String(d.discount_code_id) : "Không có"],
          ["Tạm tính", Utils.formatCurrency(d.subtotal || 0)],
          ["Thành tiền", Utils.formatCurrency(d.total_amount || 0)],
          ["Ngày tạo", d.created_at],
        ];

        document.getElementById("detailGrid").innerHTML = fields
          .map(([l, v]) => `
    <div class="detail-field">
      <div class="detail-field-label">${l}</div>
      <div class="detail-field-value">${v}</div>
    </div>
  `)
          .join("");
      }

      document.addEventListener("DOMContentLoaded", loadDetail);
    </script>
  </body>
</html>
