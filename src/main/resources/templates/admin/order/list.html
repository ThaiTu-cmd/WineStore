<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Orders - WineStore Admin</title>
    <link rel="stylesheet" th:href="@{/admin/css/style.css?v=1}" />
  </head>
  <body>
    <div class="admin-layout">
      <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

      <div class="main-wrap">
        <header class="topbar">
          <div class="topbar-info">
            <div class="topbar-title">Orders</div>
            <div class="topbar-breadcrumb">Quản lý đơn hàng</div>
          </div>
          <div class="topbar-right">
            <button
              class="icon-btn"
              title="Cài đặt"
              onclick="toggleLogoutDropdown()"
            >
              ⚙️
            </button>
            <div
              class="dropdown-menu"
              id="logoutDropdown"
              style="display: none"
            >
              <button
                class="dropdown-item dropdown-item-logout"
                onclick="logout()"
              >
                Đăng xuất
              </button>
            </div>
          </div>
        </header>

        <div class="page-wrap">
          <div class="page-header">
            <div>
              <div class="page-title">Danh sách Orders</div>
              <div class="page-subtitle">Tất cả đơn hàng trong hệ thống</div>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <div class="toolbar">
                <div class="search-box">
                  <span class="search-icon">🔎</span>
                  <input
                    type="text"
                    id="searchInput"
                    placeholder="Tìm mã đơn, tên khách..."
                    oninput="filterOrders()"
                  />
                </div>
                <select
                  class="select-filter"
                  id="statusFilter"
                  onchange="filterOrders()"
                >
                  <option value="">Tất cả trạng thái</option>
                  <option value="pending">Chờ xử lý</option>
                  <option value="shipping">Đang giao</option>
                  <option value="completed">Hoàn thành</option>
                  <option value="cancelled">Đã hủy</option>
                </select>
              </div>
              <span class="badge badge-info" id="orderCount">0 đơn</span>
            </div>

            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Order Code</th>
                    <th>Username</th>
                    <th>User ID</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="ordersBody">
                  <tr>
                    <td
                      colspan="7"
                      style="
                        text-align: center;
                        padding: 40px;
                        color: var(--text-muted);
                      "
                    >
                      Đang tải...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div class="pagination pagination-inline" id="pagination"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- DELETE CONFIRM MODAL -->
    <div class="modal-overlay" id="deleteModalOverlay">
      <div class="modal modal-sm">
        <div
          class="modal-body"
          style="padding: 32px 28px 20px; text-align: center"
        >
          <div class="confirm-icon">🗑️</div>
          <div class="confirm-title">Xác nhận xóa đơn hàng</div>
          <div class="confirm-text">
            Bạn đang xóa đơn hàng<br /><strong id="deleteTargetLabel"></strong
            ><br />Hành động này không thể hoàn tác!
          </div>
          <div class="countdown-bar">
            <div class="countdown-fill" id="countdownFill"></div>
          </div>
          <div class="countdown-label" id="countdownLabel">
            Vui lòng chờ 10 giây...
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" onclick="DeleteConfirm.hide()">
            Hủy
          </button>
          <button
            class="btn btn-danger"
            id="confirmDeleteBtn"
            onclick="DeleteConfirm.confirm()"
            disabled
          >
            Xác nhận xóa
          </button>
        </div>
      </div>
    </div>

    <script th:src="@{/admin/js/admin.js}"></script>
    <script>
      let allOrders = [];
      let currentPage = 0;
      let totalPages = 0;
      let totalElements = 0;

      async function loadOrders(page = 0) {
        const response = await API.getOrders(page);
        allOrders = response.content || [];
        currentPage = response.page || 0;
        totalPages = response.totalPages || 0;
        totalElements = response.totalElements || 0;
        renderOrders(allOrders);
        Utils.renderPagination(
          "pagination",
          currentPage,
          totalPages,
          loadOrders,
        );
      }

      function renderOrders(list) {
        document.getElementById("orderCount").textContent =
          `${totalElements} đơn`;
        document.getElementById("ordersBody").innerHTML = list.length
          ? list
              .map(
                (o) => `
        <tr>
          <td class="td-mono">#${o.id || 0}</td>
          <td class="td-mono"><strong>${o.order_code || o.orderCode || ''}</strong></td>
          <td>${o.username || 'N/A'}</td>
          <td class="td-mono">${o.user_id || o.userId || '-'}</td>
          <td style="font-weight:700;color:var(--primary)">${Utils.formatCurrency(o.total || 0)}</td>
          <td>${Utils.statusBadge(o.status || '')}</td>
          <td>
            <div class="action-group">
              <a href="/admin/order/detail?id=${o.id}" class="btn btn-sm btn-outline">👁 View</a>
              <button class="btn btn-sm btn-danger" onclick="confirmDelete(${o.id},'${(o.order_code || o.orderCode || '').replace(/'/g, "\\'")}')">🗑</button>
            </div>
          </td>
        </tr>`,
              )
              .join("")
          : `<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted)">Không tìm thấy đơn hàng nào</td></tr>`;
      }

      function filterOrders() {
        const q = document.getElementById("searchInput").value.toLowerCase();
        const st = document.getElementById("statusFilter").value;
        renderOrders(
          allOrders.filter(
            (o) =>
              (!q ||
                (o.order_code || o.orderCode || '').toLowerCase().includes(q) ||
                (o.username || '').toLowerCase().includes(q)) &&
              (!st || o.status === st),
          ),
        );
        Utils.renderPagination(
          "pagination",
          currentPage,
          totalPages,
          loadOrders,
        );
      }

      function confirmDelete(id, code) {
        DeleteConfirm.show(`"${code}"`, async () => {
          await API.deleteOrder(id);
          allOrders = allOrders.filter((o) => o.id !== id);
          renderOrders(allOrders);
          Utils.toast(`Đã xóa đơn hàng ${code}`);
        });
      }

      document.addEventListener("DOMContentLoaded", loadOrders);
    </script>
  </body>
</html>
