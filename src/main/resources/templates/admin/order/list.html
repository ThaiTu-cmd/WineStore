<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Orders - WineStore Admin</title>
    <link rel="stylesheet" th:href="@{/admin/css/style.css?v=1}" />
  </head>
  <body>
    <div class="admin-layout">
      <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

      <div class="main-wrap">
        <header class="topbar">
          <div class="topbar-info">
            <div class="topbar-title">Orders</div>
            <div class="topbar-breadcrumb">Quản lý đơn hàng</div>
          </div>
          <div class="topbar-right">
            <button class="icon-btn" title="Cài đặt" onclick="toggleLogoutDropdown()">⚙️</button>
            <div class="dropdown-menu" id="logoutDropdown" style="display: none">
              <button class="dropdown-item dropdown-item-logout" onclick="logout()">Đăng xuất</button>
            </div>
          </div>
        </header>

        <div class="page-wrap">
          <div class="page-header">
            <div>
              <div class="page-title">Danh sách Orders</div>
              <div class="page-subtitle">Tất cả đơn hàng trong hệ thống</div>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <div class="toolbar">
                <div class="search-box">
                  <span class="search-icon">🔎</span>
                  <input type="text" id="searchInput" placeholder="Tìm mã đơn, tên khách..." oninput="filterOrders()" />
                </div>
                <select class="select-filter" id="statusFilter" onchange="filterOrders()">
                  <option value="">Tất cả trạng thái</option>
                  <option value="pending">Chờ xác nhận</option>
                  <option value="processing">Xác nhận</option>
                  <option value="shipping">Đang giao</option>
                  <option value="completed">Hoàn thành</option>
                  <option value="cancelled">Đã hủy</option>
                </select>
              </div>
              <span class="badge badge-info" id="orderCount">0 đơn</span>
            </div>

            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Mã đơn</th>
                    <th>Khách hàng</th>
                    <th>Tổng tiền</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                  </tr>
                </thead>
                <tbody id="ordersBody">
                  <tr>
                    <td colspan="6" style="text-align: center; padding: 40px; color: var(--text-muted);">Đang tải...</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div class="pagination pagination-inline" id="pagination"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- CONFIRM MODAL -->
    <div class="modal-overlay" id="confirmModalOverlay">
      <div class="modal modal-sm">
        <div class="modal-body" style="padding: 32px 28px 20px; text-align: center">
          <div class="confirm-icon">✅</div>
          <div class="confirm-title">Xác nhận đơn hàng</div>
          <div class="confirm-text">Bạn có chắc muốn xác nhận đơn hàng<br /><strong id="confirmTargetLabel"></strong>?</div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" onclick="Modal.close('confirmModalOverlay')">Hủy</button>
          <button class="btn btn-success" id="confirmYesBtn" onclick="confirmAction.doConfirm()">Xác nhận</button>
        </div>
      </div>
    </div>

    <!-- REJECT MODAL -->
    <div class="modal-overlay" id="rejectModalOverlay">
      <div class="modal modal-sm">
        <div class="modal-body" style="padding: 32px 28px 20px; text-align: center">
          <div class="confirm-icon" style="color:var(--danger)">🗙</div>
          <div class="confirm-title">Từ chối đơn hàng</div>
          <div class="confirm-text">Bạn có chắc muốn từ chối đơn hàng<br /><strong id="rejectTargetLabel"></strong>?</div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" onclick="Modal.close('rejectModalOverlay')">Hủy</button>
          <button class="btn btn-danger" id="rejectYesBtn" onclick="rejectAction.doReject()">Từ chối</button>
        </div>
      </div>
    </div>

    <script th:src="@{/admin/js/admin.js}"></script>
    <script>
      let allOrders = [];
      let currentPage = 0;
      let totalPages = 0;
      let totalElements = 0;

      async function loadOrders(page = 0) {
        try {
          const response = await API.getOrders(page);
          allOrders = response.content || [];
          currentPage = response.page || 0;
          totalPages = response.totalPages || 0;
          totalElements = response.totalElements || 0;
          renderOrders(allOrders);
          Utils.renderPagination("pagination", currentPage, totalPages, loadOrders);
        } catch (e) {
          document.getElementById("ordersBody").innerHTML =
            `<tr><td colspan="6" style="text-align:center;padding:40px;color:red">Lỗi tải dữ liệu: ${e.message}</td></tr>`;
        }
      }

      function renderOrders(list) {
        const btn = (label, cls, click) => `<button class="btn btn-sm ${cls}" onclick="${click}">${label}</button>`;
        document.getElementById("orderCount").textContent = `${totalElements} đơn`;
        document.getElementById("ordersBody").innerHTML = list.length
          ? list
              .map((o) => {
                const code = (o.order_code || o.orderCode || "").replace(/'/g, "\\'");
                const canConfirm = o.status === "pending";
                return `<tr>
          <td class="td-mono">#${o.id || 0}</td>
          <td class="td-mono"><strong>${o.order_code || o.orderCode || ''}</strong></td>
          <td>${o.username || 'N/A'}</td>
          <td style="font-weight:700;color:var(--primary)">${Utils.formatCurrency(o.total || 0)}</td>
          <td>${Utils.statusBadge(o.status || '')}</td>
          <td>
            <div class="action-group">
              <a href="${APP_CONTEXT_PATH}/admin/order/detail?id=${o.id}" class="btn btn-sm btn-outline">👁 Xem</a>
              ${canConfirm ? btn('Xác nhận', 'btn-success', `showConfirm(${o.id},'${code}')`) : ''}
              ${canConfirm ? btn('Từ chối', 'btn-danger', `showReject(${o.id},'${code}')`) : ''}
            </div>
          </td>
        </tr>`;
              })
              .join("")
          : `<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--text-muted)">Không tìm thấy đơn hàng nào</td></tr>`;
      }

      function filterOrders() {
        const q = document.getElementById("searchInput").value.toLowerCase();
        const st = document.getElementById("statusFilter").value;
        renderOrders(
          allOrders.filter(
            (o) =>
              (!q ||
                (o.order_code || o.orderCode || '').toLowerCase().includes(q) ||
                (o.username || '').toLowerCase().includes(q)) &&
              (!st || o.status === st),
          ),
        );
        Utils.renderPagination("pagination", currentPage, totalPages, loadOrders);
      }

      const confirmAction = {
        id: null,
        async doConfirm() {
          try {
            await API.updateOrder(this.id, { status: "processing" });
            Modal.close("confirmModalOverlay");
            allOrders = allOrders.map((o) => o.id === this.id ? { ...o, status: "processing" } : o);
            renderOrders(allOrders);
            Utils.toast("Đã xác nhận đơn hàng thành công!");
          } catch (e) {
            Utils.toast("Xác nhận thất bại: " + e.message, "error");
          }
        },
      };

      const rejectAction = {
        id: null,
        async doReject() {
          try {
            await API.updateOrder(this.id, { status: "cancelled" });
            Modal.close("rejectModalOverlay");
            allOrders = allOrders.map((o) => o.id === this.id ? { ...o, status: "cancelled" } : o);
            renderOrders(allOrders);
            Utils.toast("Đã từ chối đơn hàng!");
          } catch (e) {
            Utils.toast("Từ chối thất bại: " + e.message, "error");
          }
        },
      };

      function showConfirm(id, code) {
        confirmAction.id = id;
        document.getElementById("confirmTargetLabel").textContent = code;
        Modal.open("confirmModalOverlay");
      }

      function showReject(id, code) {
        rejectAction.id = id;
        document.getElementById("rejectTargetLabel").textContent = code;
        Modal.open("rejectModalOverlay");
      }

      document.addEventListener("DOMContentLoaded", () => loadOrders());
    </script>
  </body>
</html>
