<!-- fragments/sidebar.html -->
<aside class="sidebar" id="sidebar" th:fragment="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M8 2h8l-1 8a3 3 0 0 1-6 0L8 2z" />
        <path d="M7 10h10" />
        <path d="M12 14v8" />
        <path d="M9 22h6" />
      </svg>
    </div>
    <div>
      <div class="logo-text">WineStore</div>
      <div class="logo-sub">Admin Panel</div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-section-label">Tổng quan</div>
    <a class="nav-item" data-page="dashboard" th:href="@{/admin}">
      <span class="nav-icon">🏠</span> Dashboard
    </a>

    <div class="nav-section-label">Quản lý đơn hàng</div>
    <a class="nav-item" data-page="orders" th:href="@{/admin/order/list}">
      <span class="nav-icon">📦</span> Orders
      <span class="nav-badge" id="navBadgeOrders">0</span>
    </a>

    <div class="nav-section-label">Sản phẩm</div>
    <a class="nav-item" data-page="products" th:href="@{/admin/product/list}">
      <span class="nav-icon">🛍</span> Products
    </a>
    <a
      class="nav-item"
      data-page="categories"
      th:href="@{/admin/product/category}"
    >
      <span class="nav-icon">🗂</span> Categories
    </a>

    <div class="nav-section-label">Người dùng</div>
    <a class="nav-item" data-page="users" th:href="@{/admin/user/list}">
      <span class="nav-icon">👥</span> Users
    </a>

    <div class="nav-section-label">Marketing</div>
    <a
      class="nav-item"
      data-page="discounts"
      th:href="@{/admin/marketing/discount}"
    >
      <span class="nav-icon">🎁</span> Discounts
    </a>

    <div class="nav-section-label">Reviews</div>
    <a class="nav-item" data-page="reviews" th:href="@{/admin/reviews/review}">
      <span class="nav-icon">⭐</span> Reviews
    </a>
  </nav>

  <div class="sidebar-bottom">
    <div class="admin-profile">
      <div class="admin-avatar">A</div>
      <div>
        <div class="admin-name">Admin Master</div>
        <div class="admin-role">Super Admin</div>
      </div>
    </div>
  </div>
</aside>
