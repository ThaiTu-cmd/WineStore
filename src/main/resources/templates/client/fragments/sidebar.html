<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
  <body>
    <!-- ===== SIDEBAR FILTER FRAGMENT ===== -->
    <aside class="filter-sidebar" th:fragment="sidebar">
      <form id="filter-form">
        <div class="filter-header">
          <h4>
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" />
            </svg>
            Bộ lọc
          </h4>
          <span class="filter-clear">Xóa tất cả</span>
        </div>

        <!-- Price Filter -->
        <div class="filter-section">
          <div class="filter-section-title">
            <span>Mức giá</span>
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </div>
          <div class="filter-options">
            <label class="filter-option">
              <input
                type="checkbox"
                name="price"
                value="under500k"
                th:checked="${param.price != null and (#lists.contains(param.price, 'under500k') or #lists.contains(param.price, 'under100k'))}"
              />
              <span>Dưới 500.000đ</span>
              <span class="count">12</span>
            </label>
            <label class="filter-option">
              <input
                type="checkbox"
                name="price"
                value="500k-1500k"
                th:checked="${param.price != null and (#lists.contains(param.price, '500k-1500k') or #lists.contains(param.price, '100k-200k'))}"
              />
              <span>500.000đ – 1.500.000đ</span>
              <span class="count">28</span>
            </label>
            <label class="filter-option">
              <input
                type="checkbox"
                name="price"
                value="1500k-3000k"
                th:checked="${param.price != null and (#lists.contains(param.price, '1500k-3000k') or #lists.contains(param.price, '200k-500k'))}"
              />
              <span>1.500.000đ – 3.000.000đ</span>
              <span class="count">35</span>
            </label>
            <label class="filter-option">
              <input
                type="checkbox"
                name="price"
                value="over3000k"
                th:checked="${param.price != null and (#lists.contains(param.price, 'over3000k') or #lists.contains(param.price, 'over1m'))}"
              />
              <span>Trên 3.000.000đ</span>
              <span class="count">8</span>
            </label>
          </div>
        </div>

        <!-- Origin Filter -->
        <div class="filter-section">
          <div class="filter-section-title">
            <span>Xuất xứ</span>
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </div>
          <div class="filter-options">
            <label class="filter-option">
              <input
                type="checkbox"
                name="origin"
                value="france"
                th:checked="${param.origin != null and #lists.contains(param.origin, 'france')}"
              />
              <span>Vang Pháp (France)</span>
              <span class="count">18</span>
            </label>
            <label class="filter-option">
              <input
                type="checkbox"
                name="origin"
                value="italy"
                th:checked="${param.origin != null and #lists.contains(param.origin, 'italy')}"
              />
              <span>Vang Ý (Italy)</span>
              <span class="count">22</span>
            </label>
            <label class="filter-option">
              <input
                type="checkbox"
                name="origin"
                value="chile"
                th:checked="${param.origin != null and #lists.contains(param.origin, 'chile')}"
              />
              <span>Vang Chile</span>
              <span class="count">14</span>
            </label>
            <label class="filter-option">
              <input
                type="checkbox"
                name="origin"
                value="scotland"
                th:checked="${param.origin != null and #lists.contains(param.origin, 'scotland')}"
              />
              <span>Whisky Scotland</span>
              <span class="count">31</span>
            </label>
          </div>
        </div>

        <!-- Brand Filter -->
        <div class="filter-section">
          <div class="filter-section-title">
            <span>Thương hiệu</span>
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </div>
          <div class="filter-options">
            <label class="filter-option">
              <input
                type="checkbox"
                name="brand"
                value="chateau-lafite"
                th:checked="${param.brand != null and #lists.contains(param.brand, 'chateau-lafite')}"
              />
              <span>Chateau Lafite</span>
              <span class="count">15</span>
            </label>
            <label class="filter-option">
              <input
                type="checkbox"
                name="brand"
                value="gaja"
                th:checked="${param.brand != null and #lists.contains(param.brand, 'gaja')}"
              />
              <span>Gaja</span>
              <span class="count">8</span>
            </label>
            <label class="filter-option">
              <input
                type="checkbox"
                name="brand"
                value="almaviva"
                th:checked="${param.brand != null and #lists.contains(param.brand, 'almaviva')}"
              />
              <span>Almaviva</span>
              <span class="count">12</span>
            </label>
            <label class="filter-option">
              <input
                type="checkbox"
                name="brand"
                value="macallan"
                th:checked="${param.brand != null and #lists.contains(param.brand, 'macallan')}"
              />
              <span>Macallan</span>
              <span class="count">20</span>
            </label>
            <label class="filter-option">
              <input
                type="checkbox"
                name="brand"
                value="chivas-regal"
                th:checked="${param.brand != null and #lists.contains(param.brand, 'chivas-regal')}"
              />
              <span>Chivas Regal</span>
              <span class="count">17</span>
            </label>
            <label class="filter-option">
              <input
                type="checkbox"
                name="brand"
                value="penfolds"
                th:checked="${param.brand != null and #lists.contains(param.brand, 'penfolds')}"
              />
              <span>Penfolds</span>
              <span class="count">10</span>
            </label>
          </div>
        </div>
      </form>
    </aside>
  </body>
</html>
