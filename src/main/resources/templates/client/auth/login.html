<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập – WineStore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/client/css/variables.css}" />
    <link rel="stylesheet" th:href="@{/client/css/main.css}" />
    <link rel="stylesheet" th:href="@{/client/css/components.css}" />
    <link rel="stylesheet" th:href="@{/client/css/pages.css}" />
    <style>
      .auth-card {
        border: 1px solid #e8e0d8 ;
      }
      .auth-title {
        color: #2c1810;
      }
      .auth-subtitle {
        color: #7a6a5a;
      }
      .form-label {
        color: #4a3a2a;
        font-weight: 600;
      }
      .form-control {
        background: #fafafa;
        border-color: #ddd5cc;
        color: #2c1810;
      }
      .form-control:focus {
        border-color: #58111a;
        box-shadow: 0 0 0 3px rgba(88, 17, 26, 0.1);
        background: #ffffff;
      }
      .form-control::placeholder {
        color: #b0a090;
      }
      .input-icon-wrap .input-icon {
        color: #b0a090;
      }
      .input-icon-wrap .input-eye,
      .input-icon-wrap .input-eye svg {
        color: #b0a090;
      }
      .input-icon-wrap .input-eye:hover {
        color: #58111a;
      }
      .btn-primary {
        background: #58111a;
        color: #ffffff;
        box-shadow: 0 4px 14px rgba(88, 17, 26, 0.3);
      }
      .btn-primary:hover {
        background: #430d14;
        box-shadow: 0 6px 20px rgba(88, 17, 26, 0.4);
      }
      .btn-ghost {
        color: #4a3a2a;
        border-color: #ddd5cc;
      }
      .btn-ghost:hover {
        background: #f5f0eb;
      }
      .divider-or {
        color: #b0a090;
      }
      .divider-or::before,
      .divider-or::after {
        background: #e0d8d0;
      }
      .auth-footer {
        color: #7a6a5a;
      }
      .auth-footer a {
        color: #58111a;
      }
      .logo-text {
        color: #2c1810;
      }
      .logo-icon {
        background: #58111a;
        border-color: #58111a;
      }
      .logo-icon svg {
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <!-- Logo -->
        <div class="auth-logo">
          <a th:href="@{/}" class="logo" style="justify-content: center">
            <div class="logo-icon">
              <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="white"
                stroke-width="2.5"
              >
                <path
                  d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
                />
              </svg>
            </div>
            <span class="logo-text">WineStore</span>
          </a>
        </div>

        <div class="text-center">
          <h3 class="auth-title">Chào mừng trở lại!</h3>
          <p class="auth-subtitle">Đăng nhập để tiếp tục mua sắm</p>
        </div>

        <!-- Error message -->
        <div
          th:if="${error}"
          style="
            background: #ffebee;
            color: #c62828;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
          "
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
          <span th:text="${error}">Sai tên đăng nhập hoặc mật khẩu.</span>
        </div>

        <!-- Success message -->
        <div
          th:if="${success}"
          style="
            background: #e8f5e9;
            color: #2e7d32;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
          "
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <polyline points="20 6 9 17 4 12" />
          </svg>
          <span th:text="${success}">Thành công.</span>
        </div>

        <!-- Login Form -->
        <form th:action="@{/auth/login}" method="post">

          <div class="form-group">
            <label class="form-label">Email</label>
            <div class="input-icon-wrap">
              <svg
                class="input-icon"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                />
                <polyline points="22,6 12,13 2,6" />
              </svg>
              <input
                class="form-control"
                type="email"
                name="email"
                th:value="${param.email}"
                placeholder="email@example.com"
                autocomplete="email"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">
              Mật khẩu
            </label>
            <div class="input-icon-wrap">
              <svg
                class="input-icon"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
              <input
                class="form-control"
                type="password"
                name="password"
                id="loginPwd"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              />
              <span
                class="input-eye"
                onclick="togglePwd('loginPwd', this)"
                title="Hiện/ẩn mật khẩu"
              >
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </span>
            </div>
            <a
              th:href="@{/auth/forgot-password}"
              style="font-size: 0.8rem; color: #58111a; display: inline-block; margin-top: 6px"
            >Quên mật khẩu?</a>
          </div>

          <div
            style="
              display: flex;
              align-items: center;
              gap: 8px;
              margin-bottom: 20px;
            "
          >
            <input
              type="checkbox"
              id="rememberMe"
              name="rememberMe"
              style="
                accent-color: var(--color-green);
                width: 15px;
                height: 15px;
              "
            />
            <label
              for="rememberMe"
              style="
                font-size: 0.875rem;
                color: #4a3a2a;
                cursor: pointer;
              "
              >Ghi nhớ đăng nhập</label
            >
          </div>

          <button type="submit" class="btn btn-primary btn-full btn-lg">
            Đăng nhập
          </button>
        </form>

        <p class="auth-footer">
          Chưa có tài khoản?
          <a th:href="@{/auth/register}">Đăng ký ngay</a>
        </p>
      </div>
    </div>

    <script>
      function togglePwd(id, icon) {
        const input = document.getElementById(id);
        input.type = input.type === "password" ? "text" : "password";
      }
    </script>
    <script th:src="@{/client/js/app.js}"></script>
  </body>
</html>
