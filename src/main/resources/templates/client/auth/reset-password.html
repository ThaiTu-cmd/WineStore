<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ð?t l?i m?t kh?u – WineStore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/client/css/variables.css}" />
    <link rel="stylesheet" th:href="@{/client/css/main.css}" />
    <link rel="stylesheet" th:href="@{/client/css/components.css}" />
    <link rel="stylesheet" th:href="@{/client/css/pages.css}" />
  </head>
  <body>
    <div th:replace="~{client/fragments/header :: header}"></div>

    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-logo">
          <a th:href="@{/}" class="logo" style="justify-content: center">
            <div class="logo-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
              </svg>
            </div>
            <span class="logo-text">Vita<span>Store</span></span>
          </a>
        </div>

        <div class="text-center">
          <h3 class="auth-title">Ð?t l?i m?t kh?u</h3>
          <p class="auth-subtitle">Nh?p m?t kh?u m?i cho tài kho?n c?a b?n</p>
        </div>

        <div th:if="" style="background:#ffebee;color:#c62828;padding:10px 14px;border-radius:8px;font-size:0.875rem;margin-bottom:20px;display:flex;align-items:center;gap:8px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
          <span th:text="">Có l?i x?y ra.</span>
        </div>

        <form th:action="@{/auth/reset-password}" method="post" id="resetForm">
          <input type="hidden" th:name="" th:value="" />
          <input type="hidden" name="email" th:value="" />
          <input type="hidden" name="token" th:value="" />

          <div class="form-group">
            <label class="form-label">M?t kh?u m?i</label>
            <div class="input-icon-wrap">
              <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
              <input class="form-control" type="password" name="password" id="resetPwd" placeholder="T?i thi?u 8 ký t?" autocomplete="new-password" required minlength="8" />
              <span class="input-eye" onclick="togglePwd('resetPwd', this)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </span>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Xác nh?n m?t kh?u m?i</label>
            <div class="input-icon-wrap">
              <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
              <input class="form-control" type="password" name="confirmPassword" id="resetPwd2" placeholder="Nh?p l?i m?t kh?u" autocomplete="new-password" required />
              <span class="input-eye" onclick="togglePwd('resetPwd2', this)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </span>
            </div>
            <p id="pwdMatchMsg" style="font-size:0.75rem;margin-top:4px"></p>
          </div>

          <button type="submit" class="btn btn-primary btn-full btn-lg">Ð?t l?i m?t kh?u</button>
        </form>

        <p class="auth-footer">
          <a th:href="@{/auth/login}">Quay l?i dang nh?p</a>
        </p>
      </div>
    </div>

    <script>
      function togglePwd(id) {
        const input = document.getElementById(id);
        input.type = input.type === "password" ? "text" : "password";
      }

      document.getElementById("resetPwd2")?.addEventListener("input", function() {
        const pwd = document.getElementById("resetPwd").value;
        const msg = document.getElementById("pwdMatchMsg");
        if (this.value === "") { msg.textContent = ""; return; }
        if (this.value === pwd) {
          msg.textContent = "? M?t kh?u kh?p";
          msg.style.color = "var(--color-green)";
        } else {
          msg.textContent = "? M?t kh?u không kh?p";
          msg.style.color = "#c62828";
        }
      });

      document.getElementById("resetForm")?.addEventListener("submit", function(e) {
        const pwd = document.getElementById("resetPwd").value;
        const pwd2 = document.getElementById("resetPwd2").value;
        if (pwd !== pwd2) {
          e.preventDefault();
          alert("M?t kh?u xác nh?n không kh?p!");
        }
      });
    </script>
    <script th:src="@{/client/js/app.js}"></script>
  </body>
</html>
